<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Damage Translator</title>
<style>
body {
    font-family: monospace;
    background: #111;
    color: #eee;
    padding: 30px;
}
textarea, #output {
    width: 100%;
    min-height: 150px;
    background: #222;
    color: white;
    border: 1px solid #555;
    padding: 15px;
    font-size: 18px;
    box-sizing: border-box;
}
label {
    display: block;
    margin-top: 20px;
}
input[type="range"] {
    width: 300px;
}
#stats {
    margin-top: 10px;
    color: #aaa;
}
</style>
</head>
<body>
<h1>Brain Damage Translator</h1>
<label>
    Brain Integrity:
    <input id="integrity" type="range" min="0" max="100" value="100">
    <span id="value">100%</span>
</label>
<h3>Symbol Settings</h3>
<label>
    Symbol Threshold:
    <input id="symbolOnset" type="range" min="0" max="100" value="95">
    <span id="symbolOnsetValue">95%</span>
</label>
<label>
    Symbol Cap:
    <input id="symbolCap" type="range" min="0" max="100" value="50">
    <span id="symbolCapValue">50%</span>
</label>
<label>
    Symbol Max:
    <input id="symbolMax" type="range" min="0" max="100" value="0">
    <span id="symbolMaxValue">0%</span>
</label>
<h3>Block Settings</h3>
<label>
    Block Threshold:
    <input id="blockOnset" type="range" min="0" max="100" value="50">
    <span id="blockOnsetValue">50%</span>
</label>
<label>
    Block Cap:
    <input id="blockCap" type="range" min="0" max="100" value="100">
    <span id="blockCapValue">100%</span>
</label>
<label>
    Block Max:
    <input id="blockMax" type="range" min="0" max="100" value="0">
    <span id="blockMaxValue">0%</span>
</label>
<div id="stats"></div>
<h2>Input</h2>
<textarea id="input">Enter text here.</textarea>
<h2>Output</h2>
<div id="output"></div>
<script>
const symbols = [
    "@", "#", "!", "&",
];
const integritySlider = document.getElementById("integrity");
const symbolOnsetSlider =
    document.getElementById("symbolOnset");
const symbolCapSlider =
    document.getElementById("symbolCap");
const symbolMaxSlider =
    document.getElementById("symbolMax");
const blockOnsetSlider =
    document.getElementById("blockOnset");
const blockCapSlider =
    document.getElementById("blockCap");
const blockMaxSlider =
    document.getElementById("blockMax");
const value =
    document.getElementById("value");
const symbolOnsetValue =
    document.getElementById("symbolOnsetValue");
const symbolCapValue =
    document.getElementById("symbolCapValue");
const symbolMaxValue =
    document.getElementById("symbolMaxValue");
const blockOnsetValue =
    document.getElementById("blockOnsetValue");
const blockCapValue =
    document.getElementById("blockCapValue");
const blockMaxValue =
    document.getElementById("blockMaxValue");
const input =
    document.getElementById("input");
const output =
    document.getElementById("output");
const stats =
    document.getElementById("stats");
function clamp(num, min, max) {
    return Math.max(min, Math.min(max, num));
}
function calculateChance(
    integrity,
    onset,
    max,
    cap
) {
    if (integrity >= onset) {
        return 0;
    }
    if (onset === max) {
        return integrity < onset
            ? cap
            : 0;
    }
    if (integrity <= max) {
        return cap;
    }
    const progress =
        (onset - integrity) /
        (onset - max);

    return clamp(
        progress * cap,
        0,
        cap
    );
}
function calculateSymbolChance(
    integrity,
    symbolOnset,
    symbolMax,
    symbolCap
) {
    return calculateChance(
        integrity,
        symbolOnset,
        symbolMax,
        symbolCap
    );
}
function calculateBlockChance(
    integrity,
    blockOnset,
    blockMax,
    blockCap
) {
    return calculateChance(
        integrity,
        blockOnset,
        blockMax,
        blockCap
    );
}
function randomSymbol() {
    return symbols[
        Math.floor(
            Math.random() * symbols.length
        )
    ];
}
function corruptText(
    text,
    integrity,
    symbolOnset,
    symbolMax,
    symbolCap,
    blockOnset,
    blockMax,
    blockCap
) {
    const symbolChance =
        calculateSymbolChance(
            integrity,
            symbolOnset,
            symbolMax,
            symbolCap
        );
    const blockChance =
        calculateBlockChance(
            integrity,
            blockOnset,
            blockMax,
            blockCap
        );
    let result = "";
    for (const char of text) {
        if (
            char === " " ||
            char === "\n" ||
            char === "\t"
        ) {
            result += char;
            continue;
        }
        let newChar = char;
        if (
            Math.random() <
            blockChance
        ) {
            newChar = "█";
        }
        else if (
            Math.random() <
            symbolChance
        ) {
            newChar = randomSymbol();
        }
        result += newChar;
    }
    return result;
}
function update() {
    const integrity =
        Number(integritySlider.value);
    const symbolOnset =
        Number(symbolOnsetSlider.value);
    const symbolCap =
        Number(symbolCapSlider.value) / 100;
    const symbolMax =
        Number(symbolMaxSlider.value);
    const blockOnset =
        Number(blockOnsetSlider.value);
    const blockCap =
        Number(blockCapSlider.value) / 100;
    const blockMax =
        Number(blockMaxSlider.value);
    value.textContent =
        integrity + "%";
    symbolOnsetValue.textContent =
        symbolOnset + "%";
    symbolCapValue.textContent =
        Math.round(symbolCap * 100) + "%";
    symbolMaxValue.textContent =
        symbolMax + "%";
    blockOnsetValue.textContent =
        blockOnset + "%";
    blockCapValue.textContent =
        Math.round(blockCap * 100) + "%";
    blockMaxValue.textContent =
        blockMax + "%";
    const symbolChance =
        calculateSymbolChance(
            integrity,
            symbolOnset,
            symbolMax,
            symbolCap
        );
    const blockChance =
        calculateBlockChance(
            integrity,
            blockOnset,
            blockMax,
            blockCap
        );
    stats.textContent =
        "Symbol chance: " +
        Math.round(symbolChance * 100) +
        "% | Block chance: " +
        Math.round(blockChance * 100) +
        "%";
    output.textContent =
        corruptText(
            input.value,
            integrity,
            symbolOnset,
            symbolMax,
            symbolCap,
            blockOnset,
            blockMax,
            blockCap
        );
}
integritySlider.addEventListener(
    "input",
    update
);
symbolOnsetSlider.addEventListener(
    "input",
    update
);
symbolCapSlider.addEventListener(
    "input",
    update
);
symbolMaxSlider.addEventListener(
    "input",
    update
);
blockOnsetSlider.addEventListener(
    "input",
    update
);
blockCapSlider.addEventListener(
    "input",
    update
);
blockMaxSlider.addEventListener(
    "input",
    update
);
input.addEventListener(
    "input",
    update
);
update();
</script>
</body>
</html>
