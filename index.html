<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Damage Translator</title>
<style>
body {
    font-family: monospace;
    background: #111;
    color: #eee;
    padding: 30px;
}
textarea, #output {
    width: 100%;
    min-height: 150px;
    background: #222;
    color: white;
    border: 1px solid #555;
    padding: 15px;
    font-size: 18px;
    box-sizing: border-box;
}
label {
    display: block;
    margin-top: 20px;
}
input {
    width: 300px;
}
#stats {
    margin-top: 10px;
    color: #aaa;
}
</style>
</head>
<body>
<h1>Brain Damage Translator</h1>
<label>
    Brain Integrity:
    <input id="integrity" type="range" min="0" max="100" value="100">
    <span id="value">100%</span>
</label>
<label>
    Symbol Threshold:
    <input id="symbolOnset" type="range" min="0" max="100" value="95">
    <span id="symbolOnsetValue">95%</span>
</label>
<label>
    Block Threshold:
    <input id="blockOnset" type="range" min="0" max="100" value="50">
    <span id="blockOnsetValue">50%</span>
</label>
<div id="stats"></div>
<h2>Input</h2>
<textarea id="input">Enter text here.</textarea>
<h2>Output</h2>
<div id="output"></div>
<script>
const symbols = [
    "@", "#", "!", "&",
];
const integritySlider = document.getElementById("integrity");
const symbolOnsetSlider = document.getElementById("symbolOnset");
const blockOnsetSlider = document.getElementById("blockOnset");
const input = document.getElementById("input");
const output = document.getElementById("output");
const value = document.getElementById("value");
const symbolOnsetValue = document.getElementById("symbolOnsetValue");
const blockOnsetValue = document.getElementById("blockOnsetValue");
const stats = document.getElementById("stats");
function clamp(num, min, max) {
    return Math.max(min, Math.min(max, num));
}
function calculateSymbolChance(integrity, symbolOnset) {
    if (integrity >= symbolOnset) {
        return 0;
    }
    if (symbolOnset <= 0) {
        return 0.5;
    }
    const progress =
        (symbolOnset - integrity) / symbolOnset;
    return clamp(progress * 0.5, 0, 0.5);
}
function calculateBlockChance(integrity, blockOnset) {
    if (integrity >= blockOnset) {
        return 0;
    }
    if (blockOnset <= 0) {
        return 1;
    }
    const progress =
        (blockOnset - integrity) / blockOnset;
    return clamp(progress, 0, 1);
}
function randomSymbol() {
    return symbols[
        Math.floor(Math.random() * symbols.length)
    ];
}
function corruptText(
    text,
    integrity,
    symbolOnset,
    blockOnset
) {
    const symbolChance =
        calculateSymbolChance(
            integrity,
            symbolOnset
        );
    const blockChance =
        calculateBlockChance(
            integrity,
            blockOnset
        );
    let result = "";
    for (const char of text) {
        if (
            char === " " ||
            char === "\n" ||
            char === "\t"
        ) {
            result += char;
            continue;
        }
        let newChar = char;
        if (Math.random() < blockChance) {
            newChar = "█";
        }
        else if (Math.random() < symbolChance) {
            newChar = randomSymbol();
        }
        result += newChar;
    }
    return result;
}
function update() {
    const integrity =
        Number(integritySlider.value);
    const symbolOnset =
        Number(symbolOnsetSlider.value);
    const blockOnset =
        Number(blockOnsetSlider.value);
    value.textContent =
        integrity + "%";
    symbolOnsetValue.textContent =
        symbolOnset + "%";
    blockOnsetValue.textContent =
        blockOnset + "%";
    const symbolChance =
        calculateSymbolChance(
            integrity,
            symbolOnset
        );
    const blockChance =
        calculateBlockChance(
            integrity,
            blockOnset
        );
    stats.textContent =
        "Symbol chance: " +
        Math.round(symbolChance * 100) +
        "% | Block chance: " +
        Math.round(blockChance * 100) +
        "%";
    output.textContent =
        corruptText(
            input.value,
            integrity,
            symbolOnset,
            blockOnset
        );
}
integritySlider.addEventListener(
    "input",
    update
);
symbolOnsetSlider.addEventListener(
    "input",
    update
);
blockOnsetSlider.addEventListener(
    "input",
    update
);
input.addEventListener(
    "input",
    update
);
update();
</script>
</body>
</html>
